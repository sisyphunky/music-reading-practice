</style></head><body><div class="studio"><aside class="studio-left"><div class="studio-kicker">A LITTLE PRACTICE, EVERY DAY</div><h1>从看见，<br>到认得。</h1><p class="studio-intro">一次认准一个音。<br>让谱面上的位置，慢慢成为<br>不必再数的熟悉。</p><div class="studio-rule"></div><nav class="screen-nav" aria-label="页面导航"><button data-action="route" data-value="practice" id="side-practice"><span><b>01</b>练习</span><span>↗</span></button><button data-action="route" data-value="progress" id="side-progress"><span><b>02</b>进度</span><span>↗</span></button><button data-action="route" data-value="settings" id="side-settings"><span><b>03</b>设置与备份</span><span>↗</span></button></nav><p class="studio-small">从四个锚点开始，逐圈扩大范围。<br>无需账号，记录只保存在本机。<br>记得定期导出备份。</p></aside><section class="phone" aria-label="五线谱识音练习"><header class="phone-head"><div class="wordmark"><span class="mark">♪</span>五线谱识音</div><span class="local-label" id="local-label"></span></header><main class="app-main" id="app-main"><div class="empty-state"><h2>正在打开练习…</h2></div></main><div class="phone-controls"><nav class="bottom-nav" id="bottom-nav" aria-label="主要导航"></nav><div class="practice-dock" id="practice-dock" hidden></div></div><div id="overlay"></div><div id="toast" role="status" aria-live="polite"></div></section></div><input id="import-input" type="file" accept=".json,application/json" hidden><noscript>请在浏览器中开启 JavaScript 后使用练习工具。</noscript><script type="module">const C=(()=>{

 const old=pool(stage).filter(n=>!fresh.some(x=>x.id===n.id)),oldErrors=old.filter(n=>{const a=records.filter(r=>r.noteId===n.id);return a.length&&!a.at(-1).correct;});
 const checks=[records.length>=40&&clefs.every(c=>c.count===20&&c.right>=18),freshStats.every(s=>s.enough&&s.accurate),freshStats.every(s=>s.quick),!oldErrors.length];

function makeSlots(stage){return ['treble','bass'].flatMap(c=>Object.entries(stage==='A'?{balanced:8,weak:2}:stage==='E'?{balanced:6,weak:2,review:2}:stage==='F'?{fresh:5,review:3,weak:2}:{fresh:6,weak:2,review:2}).map(([channel,count])=>({clef:c,channel,count})));}

// Versilian Steinway B, CC0; medium layer from StaPiano. The 0.90 s
// note and 0.07 s tail match the approved interval practice sound.
const piano=(()=>{
 const hold=.90,fade=.070,gap=.12,cache=new Map();
 let context=null,output=null,request=0;
 const pitchOf=n=>C.midi(n)+(n.sharp?1:0);
 const pitchOfSample=p=>p-p%2;
 function stop(){request++;if(!output)return;const previous=output;output=null;for(const s of previous.sources)s.stop();previous.bus.disconnect();}
 function load(pitch){
  if(!cache.has(pitch)){
   const promise=fetch(new URL(`assets/steinway-b/${pitch}.m4a`,location.href)).then(response=>{
    if(!response.ok)throw Error('Sample not available');return response.arrayBuffer();
   }).catch(error=>{cache.delete(pitch);throw error;});
   cache.set(pitch,{promise,buffer:null});
  }
  return cache.get(pitch);
 }
 async function note(pitch){
  const original=pitchOfSample(pitch),clip=load(original);
  const bytes=await clip.promise;
  clip.buffer??=context.decodeAudioData(bytes.slice(0)).catch(error=>{clip.buffer=null;throw error;});
  const audio=await clip.buffer,rate=2**((pitch-original)/12),samples=audio.getChannelData(0);
  const startFrames=Math.min(samples.length,Math.floor(.70*rate*audio.sampleRate)),endFrames=Math.min(samples.length,Math.floor(hold*rate*audio.sampleRate));
  let sum=0,peak=0;for(let i=0;i<endFrames;i++){const a=samples[i];peak=Math.max(peak,Math.abs(a));if(i<startFrames)sum+=a*a;}
  return {audio,rate,power:sum/Math.max(1,startFrames),peak};
 }
 function prepare(){
  if(!D.settings.sound)return Promise.resolve(false);
  try{
   const Audio=window.AudioContext||window.webkitAudioContext;
   if(!Audio)return Promise.resolve(false);
   context??=new Audio();
   return (context.state==='running'?Promise.resolve():context.resume()).then(()=>context.state==='running',()=>false);
  }catch{return Promise.resolve(false);}
 }
 function prefetch(n){load(pitchOfSample(pitchOf(n))).promise.catch(()=>{});}
 async function play(notes,{manual=false}={}){
  if(!D.settings.sound)return;
  stop();const token=request;
  // The automatic playback calls prepare() from the answer gesture before saving.
  // Decoding and fetching never block saving or starting the next question.
  try{
   const ready=await Promise.race([prepare(),new Promise(resolve=>setTimeout(()=>resolve(false),1200))]);
   if(token!==request)return;
   if(!ready){if(manual)toast('浏览器未开启声音，请再点一次试听。');return;}
   const clips=await Promise.all(notes.map(n=>note(pitchOf(n))));
   if(token!==request||document.hidden||S.route!=='practice'||!D.settings.sound)return;
   const bus=context.createGain();bus.connect(context.destination);const playback={bus,sources:[]};output=playback;
   // Compare the two notes at a shared level, protecting against clipping.
   const gain=Math.min(.075/Math.sqrt(Math.max(1e-8,clips.reduce((sum,c)=>sum+c.power,0)/clips.length)),.90/Math.max(.001,...clips.map(c=>c.peak)));
   const startsAt=context.currentTime+.025;
   for(const [i,clip] of clips.entries()){
    const source=context.createBufferSource(),shape=context.createGain(),start=startsAt+i*(hold+gap),end=start+hold;
    source.buffer=clip.audio;source.playbackRate.value=clip.rate;
    shape.gain.setValueAtTime(0,start);shape.gain.linearRampToValueAtTime(gain,start+.003);shape.gain.setValueAtTime(gain,end-fade);shape.gain.linearRampToValueAtTime(0,end);
    source.connect(shape).connect(bus);playback.sources.push(source);
    source.onended=()=>{shape.disconnect();if(source===playback.sources.at(-1)&&output===playback){bus.disconnect();output=null;}};
    source.start(start);source.stop(end);
   }
  }catch{if(token===request)toast('钢琴音暂时未能加载，仍可继续练习；稍后可重试试听。');}
 }
 return {prepare,prefetch,play,stop};
})();
const {prepare:preparePianoGesture,prefetch:prefetchPiano,play:playPiano,stop:stopPiano}=piano;

// Keep the reading surface and height of the shared footer stationary when navigation peeks in.
const practiceChrome=(()=>{
 const mobile=matchMedia('(max-width: 720px)');
 const phone=$('.phone'),main=$('#app-main');
 const chromeSelector='.phone-head, .bottom-nav';
 const dwell=3000, threshold=10;
 let key=null, allowed=false, shown=false, timer=null, touch=null, pressed=null;
 function clearHide(){clearTimeout(timer);timer=null;}
 function conceal(){clearHide();shown=false;phone.classList.remove('practice-nav-shown');}
 function reset(){conceal();touch=null;pressed=null;}
 function planHide(){
  clearHide();
  if(!shown||touch?.slid||pressed!==null||document.activeElement?.matches(':focus-visible')&&document.activeElement.closest(chromeSelector))return;
  timer=setTimeout(conceal,dwell);
 }
 function reveal(){if(!allowed)return;shown=true;phone.classList.add('practice-nav-shown');planHide();}
 main.addEventListener('touchstart',e=>{
  if(!allowed||e.touches.length!==1){touch=null;planHide();return;}
  const t=e.touches[0];touch={id:t.identifier,x:t.clientX,y:t.clientY,slid:false};
 },{passive:true});
 main.addEventListener('touchmove',e=>{
  if(!touch||e.touches.length!==1)return;
  const t=e.touches[0];if(t.identifier!==touch.id)return;
  const dx=Math.abs(t.clientX-touch.x),dy=Math.abs(t.clientY-touch.y);
  if(touch.slid||(dy>=threshold&&dy>dx)){touch.slid=true;reveal();}
 },{passive:true});
 function endTouch(){touch=null;planHide();}
 main.addEventListener('touchend',endTouch,{passive:true});
 main.addEventListener('touchcancel',endTouch,{passive:true});
 main.addEventListener('wheel',e=>{
  if(!e.ctrlKey&&Math.abs(e.deltaY)>Math.abs(e.deltaX))reveal();
 },{passive:true});
 // Scroll events after the gesture cover momentum scrolling. A scroll on its own never reveals navigation.
 main.addEventListener('scroll',()=>{if(shown)planHide();},{passive:true});
 phone.addEventListener('pointerdown',e=>{
  if(shown&&e.target.closest(chromeSelector)){pressed=e.pointerId;clearHide();}
 });
 function release(e){if(e.pointerId===pressed){pressed=null;planHide();}}
 window.addEventListener('pointerup',release);
 window.addEventListener('pointercancel',release);
 phone.addEventListener('focusin',e=>{if(e.target.closest(chromeSelector))planHide();});
 phone.addEventListener('focusout',()=>queueMicrotask(planHide));
 mobile.addEventListener('change',()=>{if(ready)render();});
 return {sync(){
  const active=mobile.matches&&ready&&S.route==='practice'&&!S.manualPicker&&!S.paused;
  const nextKey=active?(S.result?`feedback:${S.result.id}`:`question:${C.track(D).current?.id}`):null;
  allowed=active&&!S.modal&&!failure&&!document.hidden;
  const resetScroll=nextKey!==null&&nextKey!==key;
  if(!allowed||resetScroll)reset();
  key=nextKey;
  const dockFeedback=active&&!!S.result;
  phone.classList.toggle('practice-focus',active);
  phone.classList.toggle('practice-feedback',dockFeedback);
  return {dockFeedback,resetScroll};
 }};
})();

 if(m==='criteria')return sheet(S.stage==='F'?'加线扩展怎么练？':S.stage==='E'?'怎样保持熟练？':'怎样进入下一圈？',S.stage==='F'?'<p>高、低音谱表各练到上下加三间，共 38 个谱位。第一批 8 个新增谱位都练过两次后，下一组加入第二批。</p><p>每组 20 题，高低各 10 题；10 道新谱位、6 道旧谱位、4 道薄弱补练。已练好的旧谱位也会定期出现。</p>':S.stage==='E'?'<p>本阶段持续混合练习已有的 22 个谱位。薄弱与久未出现的音会穿插复习。想扩大范围时，可以自己进入 F。</p><p>可以参考各音表现，把准确性与速度练得更稳定。</p>':`<p>每完成一组 20 题检查一次。四项同时满足后，扩大范围。${S.auto?'':'当前为手动模式，不触发晋级。'}</p>${criteria()}<p class="helper">4 秒是初始试用门槛，不是倒计时；暂停、反馈、听音和后台时间不计入作答。</p>`,`<button class="btn primary full" data-action="close">明白了</button>`,{symbol:'chart'});
 if(m==='promotion'&&D.pendingPromotion){const p=D.pendingPromotion;return sheet(`${STAGE[p.from][0]}，完成。`,`<p>准确率、新增音的稳定性与速度均已达标。</p><div class="advance-mark">${p.to}</div><p>${p.to==='E'?'接下来进入混合巩固，不再增加新音。':`接下来进入${STAGE[p.to][0]}。之前的音仍会穿插复习。`}</p>${p.to==='E'?'':['treble','bass'].map(c=>`<div class="helper">${c==='treble'?'高音谱表新增':'低音谱表新增'}</div><div class="note-chips">${added(p.to).filter(n=>n.clef===c).map(n=>`<span class="note-chip">${nameOf(n)}</span>`).join('')}</div>`).join('')}`,`<button class="btn blue full" data-action="advance">开始${STAGE[p.to][0]}</button>`,{symbol:'check',tone:'blue',close:false});}
 if(m==='import'){const ids=new Set(D.records.map(r=>r.id)),fresh=importData.records.filter(r=>!ids.has(r.id)).length;return sheet('导入前，确认一下。',`<p>文件：${esc(importFilename)}</p><div class="import-counts"><div><strong>${importData.records.length}</strong><small>文件内记录</small></div><div><strong>${fresh}</strong><small>可新增</small></div><div><strong>${importData.records.length-fresh}</strong><small>重复，跳过</small></div></div><p>只合并新记录，保留本机记录。相同编号若内容冲突，会取消整个导入。</p><p class="helper">已有记录时保留本机偏好；空记录设备会恢复备份偏好。解锁范围取较高阶段，当前未完成题组重新安排。</p>`,`<button class="btn primary full" data-action="confirm-import">确认合并</button><button class="btn full" data-action="close">取消</button>`,{symbol:'upload'});}
 if(m==='import-success')return sheet('备份已合并并保存。',`<p>新增 ${importCount} 条记录，已有记录完整保留。</p>`,`<button class="btn primary full" data-action="close">完成</button>`,{symbol:'check',tone:'blue'});
 if(m==='about')return sheet('给已经懂规则的你。','<p>先选音名字母，再选音组；两项选完即提交。反馈中可以看琴键、听音高，再继续下一题。</p><p>自动与手动练习分开统计。手动练习不改变自动解锁阶段；答错会增加复习，不会自动降级。</p><p>声音使用 Versilian Steinway B 余韵版钢琴采样。晋级规则是安排练习的参考，不是能力认证。计时包含选择按钮的操作时间。</p><p>刷新或重新打开未完成题目时，正确率照常记录，该题不计提速，避免中断导致用时失真。重新打开可能需要网络。</p>','<button class="btn primary full" data-action="close">继续练习</button>',{symbol:'music'});
 if(typeof m==='object'&&m.type==='note'){const n=C.getNote(m.id),st=statsFor(n);return sheet(`${nameOf(n)} · ${GROUPS[n.o]}`,`<p>${clefName(n)}${posName(pos(n))} · 本模式本圈已练 ${st.arr.length} 次</p><div class="history-strip">${st.last.map(r=>`<div class="history-item ${r.correct?'blue-text':'red-text'}">${icon(r.correct?'check':'close')}<small>${r.timingValid?sec(r.ms)+' 秒':'中断题'}</small></div>`).join('')||'<span class="helper">还没有记录</span>'}</div><p>${st.pass?'最近的准确性与速度已达标，仍会穿插复习。':st.status==='待积累'?'先积累足够的作答记录，再判断稳定程度。':st.status==='提提速'?'已经能够认对，接下来继续提高反应速度。':'这个位置还需巩固，之后会增加复习。'}</p><p class="helper">高低音谱表分别记录。为保证配比与错题间隔，接下来的题目由练习规则统一安排。</p>`,`<button class="btn primary full" data-action="return-practice">继续练习</button><button class="btn full" data-action="close">返回进度</button>`,{symbol:'chart'});}
 if(typeof m==='object'&&['stage','stage-start'].includes(m.type)){
  const k=m.key,starting=m.type==='stage-start',range=k==='E'?pool('D'):added(k);
  const description=k==='A'?'先练这四个锚点谱位。中央 C 在高、低音谱表各练一次。':k==='E'?'复习原有的 22 个谱位，也可主动进入 F。':k==='F'?'原有 22 个照常复习，下列 16 个新谱位分两批加入。':'本圈新增以下谱位，已学的音继续复习。';
  const actions=!starting&&k==='F'&&S.auto&&S.unlocked==='E'&&!D.pendingPromotion&&S.stage==='E'?'<button class="btn primary full" data-action="switch-extension" data-value="F">进入 F · 加线扩展</button><button class="btn full" data-action="close">返回</button>':!starting&&k==='F'&&S.auto&&S.unlocked!=='E'?'<p class="helper">自动练习达到 E 后可进入 F；也可在设置关闭自动推进后，到练习页手动选择 F。</p><button class="btn primary full" data-action="close">返回</button>':starting?'<button class="btn primary full" data-action="begin-practice">开始第 1 题</button><button class="btn full" data-action="close">返回进度</button>':'<button class="btn primary full" data-action="close">返回</button>';
  return sheet(`${k} · ${STAGE[k][0]}`,`<p><strong>${STAGE[k][1]}</strong> · ${description}</p>${['treble','bass'].map(c=>`<p class="helper">${c==='treble'?'高音谱表':'低音谱表'}</p><div class="note-chips">${range.filter(n=>n.clef===c).map(n=>`<span class="note-chip">${nameOf(n)}</span>`).join('')}</div>`).join('')}`,actions,{symbol:'music'});
 }
 return '';
}
function render(){
 syncView();
 const layout=practiceChrome.sync();
 $('#practice-dock').hidden=!layout.dockFeedback;
 $('#practice-dock').innerHTML=layout.dockFeedback?feedbackActions(S.result):'';
 $('#local-label').innerHTML=`<button data-action="storage-info" aria-label="查看本地记录说明">${icon('shield')}${busy?'正在保存…':'本机记录'}</button>`;
 $('#app-main').innerHTML=ready?(S.route==='practice'?(S.manualPicker?manualStagePicker():quiz(layout.dockFeedback)):S.route==='progress'?progress():settings()):'<div class="empty-state"><h2>正在读取本机记录…</h2><p>记录保存成功后，练习才会继续。</p></div>';
 $('#app-main').classList.toggle('saving',busy);
 $('#bottom-nav').innerHTML=[['practice','music','练习'],['progress','chart','进度'],['settings','settings','设置']].map(([r,i,l])=>`<button data-action="route" data-value="${r}" class="${S.route===r?'active':''}" ${S.route===r?'aria-current="page"':''}>${icon(i)}${l}</button>`).join('');
 for(const r of ['practice','progress','settings'])$('#side-'+r)?.classList.toggle('selected',S.route===r);
 const hadDialog=!!$('#overlay').firstElementChild;$('#overlay').innerHTML=modal();$('#app-main').inert=!!(S.modal||failure);$('#bottom-nav').inert=!!(S.modal||failure);$('#practice-dock').inert=!!(S.modal||failure);$('.phone-head').inert=!!(S.modal||failure);
 if(!hadDialog&&(S.modal||failure))requestAnimationFrame(()=>$('#overlay button')?.focus({preventScroll:true}));
 if(!D.settings.sound||S.route!=='practice'||S.manualPicker)stopPiano();
 if(ready&&S.route==='practice'&&!S.manualPicker&&!S.result&&D.settings.sound&&S.q&&!S.modal&&!S.paused)prefetchPiano(S.q);
 if(layout.resetScroll||previousRoute!==S.route)$('#app-main').scrollTop=0;previousRoute=S.route;clockSync();
}
function toast(message){clearTimeout(toastTimer);$('#toast').innerHTML=`<div class="toast">${esc(message)}</div>`;toastTimer=setTimeout(()=>$('#toast').innerHTML='',4500);}
async function persist(updater,{after=null,revision=true}={}){
 if(busy)return false;stopClock();busy=true;render();
 const attempt=async()=>{if(!db.db)await db.open();return db.change(updater,revision?D.revision:null);};
 try{D=await attempt();failure=null;busy=false;if(after)after();render();return true;}
 catch(e){busy=false;failure={message:e.message||'浏览器无法保存记录，请检查可用空间及网站权限。',conflict:e.name==='RevisionConflict',retry:async()=>{D=await db.read();return persist(updater,{after,revision:true});}};render();return false;}
}
async function beginNext(){stopPiano();S.modal=null;S.paused=false;S.letter=null;S.group=null;return persist(d=>{const t=C.track(d);t.feedback=null;C.nextQuestion(d);});}
async function submitAnswer(){
 if(busy||failure||S.paused||S.result||S.letter===null||S.group===null)return;
 preparePianoGesture();stopClock();const q=C.track(D).current;if(!q)return;const answer={l:S.letter,o:S.group},duration=Math.max(0,Math.round(elapsed));
 const saved=await persist(d=>C.answerQuestion(d,q.id,answer,duration,!q.interrupted),{after:()=>{S.letter=null;S.group=null;if(D.settings.auto&&D.pendingPromotion)S.modal='promotion';playPiano([C.getNote(q.noteId)]);}}); const r=D.records.find(x=>x.id===q.id); if(saved&&r?.correct&&D.settings.autoNext&&(!D.settings.auto||!D.pendingPromotion))autoTimer=setTimeout(()=>{if(S.route==='practice'&&!S.manualPicker&&!S.modal&&!failure&&!S.paused&&C.track(D).feedback===q.id&&!document.hidden)beginNext();},2000);
}
// Older versions prepared a question on load, so a saved question alone
// cannot tell us whether someone actually chose to start.
function hasStartedPractice(data) {
 return data.practiceStarted === true || data.records.length > 0;
}
function manualSession(d,k=d.settings.manualStage){
 const t=d.tracks[`manual:${k}`];return !!(t?.current||t?.feedback||t?.completed)||d.records.some(r=>r.mode==='manual'&&r.stage===k);
}
function hasAutoSession(d){
 return d.unlocked!=='A'||d.records.some(r=>r.mode==='auto')||Object.entries(d.tracks).some(([k,t])=>k.startsWith('auto:')&&(t.feedback||t.completed||(t.current&&d.practiceStarted===true)))||(hasStartedPractice(d)&&!KEYS.some(k=>manualSession(d,k)));
}
function showManualPicker(){
 stopClock();stopPiano();S.route='practice';S.modal=null;S.manualPicker=D.settings.manualStage;S.paused=false;render();
 $('#app-main').scrollTop=0;
}
async function boot(){
 if(location.protocol==='file:'){$('#app-main').innerHTML='<div class="empty-state"><h2>请从固定网址打开。</h2><p>本地数据库需要稳定的网页地址。请双击同文件夹的「音乐学习_启动本地试用_v8_草稿.command」，然后使用打开的网址练习。</p><p>发布后直接使用 GitHub Pages 网址即可。</p></div>';return;}
 try {
  await db.open();
  D = await db.change(data => {
   const currentTrack = C.track(data);
   if (currentTrack.current) currentTrack.current.interrupted = true;
   if ((data.settings.auto?hasAutoSession(data):manualSession(data)) && !(data.settings.auto&&data.pendingPromotion) && !currentTrack.feedback) C.nextQuestion(data);
  });
  ready = true;
  S.route = (D.settings.auto?hasAutoSession(D):manualSession(D)) ? 'practice' : 'progress';
  S.manualPicker=null;S.manualChoiceRequired=false;
  S.modal = !D.welcomeSeen ? 'welcome' : D.settings.auto&&D.pendingPromotion ? 'promotion' : null;
  render();
 }
 catch(e){failure={message:e.message||'浏览器无法打开本地记录。',retry:boot};render();}
}
async function exportRecords(){
 stopClock();let saved=D;try{if(db.db)saved=await db.read();}catch{}const now=new Date();const value=C.backupOf(saved,now),url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));
 const a=document.createElement('a');a.href=url;a.download=`五线谱识音_练习备份_${C.dayKey(now)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),20000);
 if(!failure)await persist(d=>{d.lastExport=now.toISOString();},{revision:false});
 toast('备份下载已发起，请确认文件已保存。未保存的本题不包含在备份内。');clockSync();
}
async function handleAction(a,v,el){
 if(a==='export')return exportRecords();
 if(a==='reload'){failure=null;ready=false;S.modal=null;S.paused=false;render();return boot();}
 if(a==='retry'){const retry=failure?.retry;failure=null;if(retry)return retry();return boot();}
 if(busy||failure||!ready)return;
 if (S.modal === 'welcome' && a !== 'welcome' && a !== 'welcome-backup') return;
 if (a === 'route' || a === 'return-practice' || a === 'go-backup') {
  const route = a === 'route' ? v : a === 'go-backup' ? 'settings' : 'practice';
  stopClock();
  if (route === 'practice' && !D.settings.auto && (S.route==='practice'||S.manualPicker||S.manualChoiceRequired||!manualSession(D))) return showManualPicker();
  S.manualPicker=null;
  if (route === 'practice' && D.settings.auto && !hasAutoSession(D)) {
   S.route = 'progress';
   S.modal = {type:'stage-start',key:C.activeStage(D)};
   render();
   return;
  }
  if (route === 'practice') S.paused = false;
  S.route = route;
  S.modal = route === 'practice' && D.settings.auto&&D.pendingPromotion ? 'promotion' : null;
  render();
  return;
 }
 if (a === 'begin-practice') {
  if (!D.settings.auto || S.modal?.type !== 'stage-start' || S.modal.key !== C.activeStage(D) || hasAutoSession(D)) return;
  return persist(data => {
   C.nextQuestion(data);
   data.practiceStarted = true;
  }, {after: () => {
   S.route = 'practice';
   S.modal = null;
   S.paused = false;
  }});
 }
 if(a==='choose-manual-stage'&&!D.settings.auto&&S.route==='practice')return showManualPicker();
 if(a==='pick-manual-stage'&&S.manualPicker&&!D.settings.auto&&KEYS.includes(v)){
  S.manualPicker=v;render();$(`.manual-stage[data-value="${v}"]`)?.focus({preventScroll:true});return;
 }
 if(a==='cancel-manual-stage'&&S.manualPicker&&manualSession(D)){
  if(!C.track(D).current&&!C.track(D).feedback){S.manualPicker=D.settings.manualStage;return handleAction('start-manual-stage');}
  S.manualPicker=null;S.manualChoiceRequired=false;render();return;
 }
 if(a==='start-manual-stage'&&S.manualPicker&&!D.settings.auto){
  const stage=S.manualPicker;
  return persist(d=>{
   if(d.settings.auto||!KEYS.includes(stage))throw Error('练习模式已变更，请重新选择。');
   if(stage!==d.settings.manualStage){const previous=C.track(d).current;if(previous)previous.interrupted=true;}
   d.settings.manualStage=stage;C.nextQuestion(d);d.practiceStarted=true;
  },{after:()=>{
   if(stage!==S.stage){S.letter=null;S.group=null;}
   S.route='practice';S.manualPicker=null;S.manualChoiceRequired=false;S.modal=null;S.paused=false;
   $('#app-main').scrollTop=0;
  }});
 }
 if(a==='letter'||a==='group'){if(S.manualPicker||S.result||S.paused)return;if(a==='letter')S.letter=Number(v);else S.group=Number(v);if(S.letter!==null&&S.group!==null)return submitAnswer();render();return;}
 if(a==='next')return beginNext();
 if(a==='pause'){stopClock();S.paused=true;render();return;}
 if(a==='resume'){S.paused=false;render();return;}
 if(a==='close'){S.modal=null;render();return;}
 if (a === 'welcome' || a === 'welcome-backup') {
  return persist(data => { data.welcomeSeen = true; }, {after: () => {
   S.modal = null;
   S.route = a === 'welcome-backup' ? 'settings' : 'progress';
  }});
 }
 if(a==='switch-extension'){
  if(!D.settings.auto||D.unlocked!=='E'||D.pendingPromotion||!['E','F'].includes(v))return;
  S.letter=null;S.group=null;
  return persist(d=>{if(C.useExtensionStage(d,v)){C.nextQuestion(d);d.practiceStarted=true;}},{after:()=>{S.route='practice';S.modal=null;S.paused=false;}});
 }
 if(a==='advance')return persist(d=>{d.pendingPromotion=null;C.nextQuestion(d);},{after:()=>{S.modal=null;S.paused=false;}});
 if(a==='criteria'||a==='storage-info'||a==='about'){S.modal=a;render();return;}
 if(a==='stage-info'){S.modal={type:'stage',key:v};render();return;}
 if(a==='note-detail'){S.modal={type:'note',id:v};render();return;}
 if(a==='filter'){S.filter=v;render();return;}
 if(a==='tone'){playPiano([{l:Number(el.dataset.l),o:Number(el.dataset.o),sharp:!!el.dataset.sharp}],{manual:true});return;}
 if(a==='replay'){if(!S.sound){toast('声音已关闭，可在设置中开启。');return;}playPiano(S.result&&!S.result.correct?[S.result.answer,S.q]:[S.q],{manual:true});return;}
 if(a==='toggle'||a==='notation'){
  const nextValue=a==='toggle'?!D.settings[v]:v;
  if(a==='toggle'&&v==='auto'){
   S.letter=null;S.group=null;
   return persist(d=>{
    const previous=C.track(d).current;if(previous)previous.interrupted=true;
    d.settings.auto=nextValue;
    const target=C.track(d);
    if(nextValue&&hasAutoSession(d)&&!d.pendingPromotion&&!target.feedback)C.nextQuestion(d);
   },{after:()=>{S.manualPicker=null;S.manualChoiceRequired=!nextValue;S.paused=false;}});
  }
  return persist(d=>{if(a==='toggle')d.settings[v]=nextValue;else d.settings.notation=v;});
 }
 if(a==='import'){$('#import-input').value='';$('#import-input').click();return;}
 if(a==='confirm-import'){const backup=importData;return persist(d=>{importCount=C.mergeBackup(d,backup).added;const t=C.track(d);if(d.settings.auto&&hasAutoSession(d)&&!t.feedback&&!d.pendingPromotion)C.nextQuestion(d);},{after:()=>{S.modal='import-success';S.letter=null;S.group=null;}});}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)handleAction(el.dataset.action,el.dataset.value,el).catch(e=>{stopClock();toast(e.message||'操作未完成，请重试。');});});
$('#import-input').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>40*1024*1024)throw Error('备份超过 40 MB，请保留原文件并联系反馈。');importData=C.validateBackup(JSON.parse(await f.text()));importFilename=f.name;S.modal='import';render();}catch(err){toast('未导入：'+err.message);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopPiano();stopClock();if(S.route==='practice'&&!S.manualPicker&&!S.result)S.paused=true;render();}});
window.addEventListener('pagehide',()=>{stopPiano();stopClock();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal&&!['welcome','promotion'].includes(S.modal)&&!failure){S.modal=null;render();}if(e.key==='Tab'&&(S.modal||failure)){const items=[...$('#overlay').querySelectorAll('button,a,input')].filter(x=>!x.disabled),first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
boot();
</script></body></html>
